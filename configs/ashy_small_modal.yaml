# Ashy-Small: GPT-2 117M + CER — training on Modal GPU.
# General-purpose modal config (swap data_dir for your dataset).
#
# One-time setup:
#   modal setup
#   modal secret create wandb-secret WANDB_API_KEY=<your-key>
#   make modal-upload-data

model:
  cer:
    enabled: true

training:
  data_dir: "data/wikitext"
  warmup_steps: 500
  batch_size: 6
  gradient_accumulation_steps: 80
  eval_interval: 200
  save_interval: 1000
  gradient_checkpointing: true
  compile: false
  wandb_project: ashy-small
  wandb_enabled: true
  modal:
    enabled: true
    gpu: "A10G"
