name: internvid
version: "1.0"
description: "Large-scale video-text dataset with LLM-annotated captions covering 7M+ videos"
modality: video_text

source:
  type: huggingface
  path: "OpenGVLab/InternVid"
  subset: "default"
  split: "train"
  revision: null

license:
  name: "Apache-2.0"
  url: "https://www.apache.org/licenses/LICENSE-2.0"
  allowed_use: research
  attribution: "OpenGVLab"

provenance:
  dedup_status: "video-level dedup"
  pii_scrub: "none"
  quality_filter: "LLM-based caption scoring"

fetch:
  max_documents: null
  max_size_gb: null
  streaming: true
  output_dir: "data/raw/internvid"

cleaning:
  output_dir: "data/clean/internvid"
  steps:
    - name: download_video
    - name: video_duration_filter
      params:
        min_seconds: 5
        max_seconds: 60
    - name: frame_extraction
      params:
        fps: 1.0
    - name: clip_score_filter
      params:
        min_score: 0.25
    - name: dedup_exact
    - name: caption_length_filter
      params:
        min_chars: 10
        max_chars: 500
