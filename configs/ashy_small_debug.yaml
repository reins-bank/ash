# Tiny model for fast iteration. Runs in under a minute on CPU.

model:
  n_layer: 2
  n_head: 4
  d_model: 128
  block_size: 256
  cer:
    enabled: true
    n_ash_heads: 1
    esc_mlp_hidden: 32
    cr_dim_divisor: 4

training:
  learning_rate: 1e-3
  max_steps: 100
  batch_size: 4
  gradient_accumulation_steps: 1
  warmup_steps: 10
  eval_interval: 50
  eval_iters: 10
  save_interval: 50
  log_interval: 5
  wandb_enabled: true
  device: cpu
  compile: false
  dtype: float32
