# Ashy-Small: GPT-2 117M + CER (full configuration)
# All values here are defaults — this file exists for explicitness.

model:
  n_layer: 12
  n_head: 12
  d_model: 768
  vocab_size: 50257
  block_size: 1024
  dropout: 0.0
  bias: true
  cer:
    enabled: true
    n_ash_heads: 2
    esc_mlp_hidden: 64
    ash_lambda_init: 0.01
    cr_dim_divisor: 4
    cr_injection_scale: 0.1
    lambda_esc_max: 0.1
    lambda_ash_reg_max: 0.05
    curriculum_phase1_end: 0.1
    curriculum_phase2_end: 0.3

training:
  learning_rate: 6e-4
  weight_decay: 0.1
  max_steps: 100000
  batch_size: 12
  gradient_accumulation_steps: 40
  wandb_project: ashy-small
  wandb_enabled: true
  dtype: bfloat16
  modal:
    enabled: false
