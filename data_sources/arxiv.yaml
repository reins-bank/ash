name: arxiv
version: "1.0"
description: "ArXiv papers — scientific and mathematical text for reasoning"

source:
  type: huggingface
  path: "togethercomputer/RedPajama-Data-V2"
  subset: "arxiv"
  split: "train"
  revision: null

license:
  name: "CC-BY-4.0"
  url: "https://creativecommons.org/licenses/by/4.0/"
  allowed_use: research
  attribution: "arXiv / Together AI (RedPajama)"

provenance:
  dedup_status: "document-level by arXiv ID"
  pii_scrub: "none (author-submitted)"
  quality_filter: "peer-reviewed submissions"

fetch:
  max_documents: null
  max_size_gb: null
  streaming: true
  output_dir: "data/raw/arxiv"

cleaning:
  output_dir: "data/clean/arxiv"
  steps:
    - name: strip_latex_commands
    - name: normalize_whitespace
    - name: min_length_filter
      params:
        min_chars: 500
    - name: dedup_exact
    - name: tokenize
      params:
        tokenizer: gpt2
