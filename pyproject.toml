[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ash"
version = "0.1.0"
description = "Ashy-Small: GPT-2 scale proof-of-concept for Contextual Epistemic Release (CER)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "tiktoken>=0.5",
    "wandb",
    "datasets",
    "numpy",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
modal = ["modal>=1.0"]

[tool.setuptools.packages.find]
include = ["ash*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
