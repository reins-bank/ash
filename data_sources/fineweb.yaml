name: fineweb
version: "1.0"
description: "Large-scale curated and deduplicated web text from CommonCrawl"

storage:
  backend: s3

source:
  type: huggingface
  path: "HuggingFaceFW/fineweb"
  subset: "default"
  split: "train"
  revision: null

license:
  name: "ODC-By-1.0"
  url: "https://opendatacommons.org/licenses/by/1-0/"
  allowed_use: research
  attribution: "HuggingFace FineWeb team"

provenance:
  dedup_status: "document-level MinHash"
  pii_scrub: "url/email regex"
  quality_filter: "FineWeb pipeline v1"

fetch:
  max_documents: null
  max_size_gb: null
  streaming: true
  output_dir: "data/raw/fineweb"

cleaning:
  output_dir: "data/clean/fineweb"
  steps:
    - name: strip_html
    - name: normalize_whitespace
    - name: min_length_filter
      params:
        min_chars: 100
    - name: dedup_exact
    - name: tokenize
      params:
        tokenizer: gpt2
