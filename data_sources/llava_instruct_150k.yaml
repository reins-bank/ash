name: llava_instruct_150k
version: "1.0"
description: "150K GPT-generated visual instruction samples plus 515K VQA data for multimodal instruction tuning"
modality: multimodal_instruction

source:
  type: huggingface
  path: "liuhaotian/LLaVA-Instruct-150K"
  subset: "default"
  split: "train"
  revision: null

license:
  name: "Apache-2.0"
  url: "https://www.apache.org/licenses/LICENSE-2.0"
  allowed_use: research
  attribution: "Haotian Liu et al."

provenance:
  dedup_status: "none"
  pii_scrub: "none"
  quality_filter: "GPT-4 generated instructions"

fetch:
  max_documents: null
  max_size_gb: null
  streaming: true
  output_dir: "data/raw/llava_instruct_150k"

cleaning:
  output_dir: "data/clean/llava_instruct_150k"
  steps:
    - name: download_images
    - name: normalize_whitespace
    - name: caption_length_filter
      params:
        min_chars: 20
        max_chars: 4000
    - name: dedup_exact
